# 秋田県 + 全市町村の広報紙取得ルール（Phase 4 / NM-16）
# status:
#   active     — listingUrl + strategy 検証済み（取得を試行）
#   incomplete — URL 未確定 / 要手直し（スキップして続行）
# strategy:
#   listing-pdf     — 一覧 HTML から最新 PDF リンクを拾う
#   issue-then-pdf  — 一覧 → 最新号ページ → PDF
#   skip            — 取得しない（incomplete 用）

version: 1
defaults:
  userAgent: nabecco-media-fetch/0.1 (+https://github.com/lirenabe/nabecco-media)
  timeoutMs: 45000
  outDir: data/kouhou

sources:
  - id: pref-akita
    name: 秋田県
    code: "05000"
    status: active
    listingUrl: https://www.pref.akita.lg.jp/pages/archive/94977
    fetch:
      strategy: listing-pdf
      pick: first
      pdfHrefPattern: "\\.pdf($|\\?)"
      excludeHrefPattern: "音声|voice|mp3"
    notes: 令和8年度 秋田県広報紙一覧。先頭 PDF が最新号。

  - id: city-akita
    name: 秋田市
    code: "05201"
    status: active
    listingUrl: https://www.city.akita.lg.jp/shisei/koho/1003635/index.html
    fetch:
      strategy: issue-then-pdf
      pick: first
      issueHrefPattern: "/shisei/koho/1003635/\\d+\\.html"
      pdfHrefPattern: "\\.pdf($|\\?)"
      preferHrefPattern: "new\\.pdf"
      excludeHrefPattern: "spread|音声"
    notes: 一覧の先頭が最新号。ページごと PDF（*new.pdf）を優先。

  - id: city-noshiro
    name: 能代市
    code: "05202"
    status: active
    listingUrl: https://www.city.noshiro.lg.jp/city/koho/noshiro/back/reiwa08_2026/
    fetch:
      strategy: issue-then-pdf
      pick: last
      issueHrefPattern: "/city/koho/noshiro/back/reiwa08_2026/\\d+"
      pdfHrefPattern: "\\.pdf($|\\?)"
      pdfPick: first
    notes: 令和8年バックナンバー。末尾が最新号。号ページは分割 PDF（先頭ページから取得）。

  - id: city-yokote
    name: 横手市
    code: "05203"
    status: active
    listingUrl: https://www.city.yokote.lg.jp/shisei/1001175/1001439/1013178.html
    fetch:
      strategy: listing-pdf
      pick: first
      pdfHrefPattern: "shiho\\.pdf($|\\?)"
      excludeHrefPattern: "betsu|別冊"
    notes: 市報よこて令和8年度発行分。先頭が最新号。

  - id: city-odate
    name: 大館市
    code: "05204"
    status: active
    listingUrl: https://www.city.odate.lg.jp/city/handbook/handbook14/page61/kouhou_odate/bucknumber/backnumber2025
    fetch:
      strategy: issue-then-pdf
      pick: last
      issueHrefPattern: "backnumber2025/p\\d+"
      pdfHrefPattern: "\\.pdf($|\\?)"
      preferHrefPattern: "202[5-9]\\d+\\.pdf"
    notes: 2025年以降バックナンバー。末尾の号ページ＋ファイル名の新しい年を優先。

  - id: city-oga
    name: 男鹿市
    code: "05205"
    status: active
    listingUrl: https://www.city.oga.akita.jp/soshik/kikakuseisakuka/kohooga/8361.html
    fetch:
      strategy: listing-pdf
      pick: first
      pdfHrefPattern: "\\.pdf($|\\?)"
      preferHrefPattern: "kouhouR8|R8_"
    notes: 広報男鹿バックナンバー（令和8年）。先頭 PDF が最新号。公式ドメインは city.oga.akita.jp。

  - id: city-yuzawa
    name: 湯沢市
    code: "05206"
    status: active
    listingUrl: https://www.city-yuzawa.jp/life/5/46/274/
    fetch:
      strategy: issue-then-pdf
      pick: first
      issueHrefPattern: "/soshiki/4/\\d+\\.html"
      pdfHrefPattern: "\\.pdf($|\\?)"
      preferTextPattern: "\\ball\\b"
    notes: 今年度発行の広報ゆざわ「コネクト」。号ページの all PDF を優先。

  - id: city-kazuno
    name: 鹿角市
    code: "05207"
    status: active
